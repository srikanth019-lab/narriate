<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-KQWKWFQQ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happstat - Emoji Gallery</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/emoji gallery.css') }}">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KQWKWFQQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->


<div class="container">

    <!-- Top Bar -->
    <header class="top-bar">

        <a href="{{ url_for('emojis_search_page') }}" class="back-btn">
            ←
        </a>

        <div class="emoji-info">
            <span class="emoji">{{ emoji.emoji }}</span>
            <span class="emoji-name">{{ emoji.name }}</span>
        </div>

       <form
    action="{{ url_for('emoji_gallery', username=profile_user.username, emoji_id=emoji.id) }}"
    method="POST"
    enctype="multipart/form-data"
    id="uploadForm"
>
 <!-- Camera -->
          

      <!-- Photos / Gallery -->
            <input
                type="file"
                id="mediaInput"
                name="image"
                hidden
                accept="image/*,video/*"
    >
    {% if logged_in_user_id ==profile_user.id%}
    <button
        type="button"
        class="add-btn"
        onclick="toggleUploadMenu()"
    >
        ＋
    </button>
    {% endif %}
</form>

    </header>

    <!-- Post Count -->
    <div class="post-count">
        <strong>{{ posts|length }}</strong> Posts
    </div>

    <!-- Gallery -->

    <div class="gallery-grid">

    {% for post in posts %}
    <div class="gallery-item">
        {% if post.media_type == "image" %}
        <a href="{{ url_for('view_post', post_id=post.id) }}">
            <img src="{{ post.image_url }}" alt="">
        </a>
        {% elif post.media_type == "video" %}
              <a href="{{ url_for('view_post', post_id=post.id) }}">
    <video class="gallery-video" muted>
        <source src="{{ post.image_url }}" type="video/mp4">
    </video>
    </a>
        {% endif %}
    </div>

    {% endfor %}

</div>
<!-- ============================= -->
<!-- UPLOAD MENU -->
<!-- ============================= -->

<div
    id="uploadMenu"
    class="upload-menu"
>

    <button
        type="button"
        class="upload-option"
        onclick="openCamera()"
    >

        <span class="upload-icon">
            📷
        </span>

        <span>
            Camera
        </span>

    </button>


    <button
        type="button"
        class="upload-option"
        onclick="openPhotos()"
    >

        <span class="upload-icon">
            🖼️
        </span>

        <span>
            Photos
        </span>

    </button>

</div>


</div><script>
const uploadMenu = document.getElementById("uploadMenu");
const mediaInput = document.getElementById("mediaInput");
const form = document.getElementById("uploadForm");

function toggleUploadMenu() {
    uploadMenu.classList.toggle("show");
}

function openCamera() {
    uploadMenu.classList.remove("show");

    mediaInput.value = "";
    mediaInput.accept = "image/*";
    mediaInput.setAttribute("capture", "environment");

    mediaInput.click();
}

function openPhotos() {
    uploadMenu.classList.remove("show");

    mediaInput.value = "";
    mediaInput.accept = "image/*,video/*";
    mediaInput.removeAttribute("capture");

    mediaInput.click();
}

function handleFile(file) {

    if (!file) {
        console.log("No file selected");
        return;
    }

    console.log("Selected:", file.name);
    console.log("Type:", file.type);
    console.log("Size:", file.size);

    if (file.type.startsWith("image/")) {
        console.log("Uploading image...");
        form.submit();
        return;
    }

    if (file.type.startsWith("video/")) {

        const video = document.createElement("video");
        video.preload = "metadata";

        video.onloadedmetadata = function () {

            URL.revokeObjectURL(video.src);

            if (video.duration > 60) {
                alert("Video must be 1 minute or less.");
                mediaInput.value = "";
                return;
            }

            console.log("Uploading video...");
            form.submit();
        };

        video.src = URL.createObjectURL(file);
        return;
    }

    alert("Please select an image or video.");
    mediaInput.value = "";
}

mediaInput.addEventListener("change", function () {
    handleFile(this.files[0]);
});

document.addEventListener("click", function(event) {

    const button = document.querySelector(".add-btn");

    if (!button) return;

    if (
        uploadMenu.classList.contains("show") &&
        !uploadMenu.contains(event.target) &&
        !button.contains(event.target)
    ) {
        uploadMenu.classList.remove("show");
    }
});

</script>


</body>
</html>
