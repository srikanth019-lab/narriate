    <link rel="stylesheet" href="{{ url_for('static', filename='css/explore.css') }}">

 <!-- FFmpeg WebAssembly -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KQWKWFQQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="container">

   <header class="top-bar">

    <a href="{{ url_for('profile') }}" class="back-btn">
        ←
    </a>

    <div class="explore-title">
        Explore
    </div>

    {% if logged_in_user_id %}
    <form
        action="{{ url_for('explore_upload') }}"
        method="POST"
        enctype="multipart/form-data"
        id="uploadForm"
    >

        <input
            type="file"
            id="cameraInput"
            name="video"
            hidden
            accept="video/*"
            capture="environment"
    >
           
     <!-- Photos: select video from gallery -->
    <input
        type="file"
        id="photosInput"
        name="video"
        hidden
        accept="video/*"
    >


        <button
            type="button"
            class="add-btn"
            onclick="toggleUploadMenu()"
        >
            ＋
        </button>

    </form>
    {% endif %}

   

    <!-- Gallery -->

    <div class="explore-grid">

 

    {% for post in video_posts %}

    <a href="{{ url_for('explore_post_view', post_id=post.id,source='explore') }}"
       class="explore-item">

        <video
            class="explore-video"
            muted
            playsinline
            preload="metadata"
        >
            <source src="{{ post.video_url }}" type="video/mp4">
        </video>

    </a>

    {% endfor %}

</div>
<!-- Upload menu -->
<div id="uploadMenu" class="upload-menu">

    <button type="button" class="upload-option" onclick="openCamera()">
        <span class="upload-icon">📷</span>
        <span>Camera</span>
    </button>

    <button type="button" class="upload-option" onclick="openPhotos()">
        <span class="upload-icon">🖼️</span>
        <span>Photos</span>
    </button>

</div>
   

</div> 
    <script>

const uploadMenu = document.getElementById("uploadMenu");

const cameraInput = document.getElementById("cameraInput");
const photosInput = document.getElementById("photosInput");

const form = document.getElementById("uploadForm");



// Cloudinary settings
const CLOUDINARY_CLOUD_NAME = "gxy7cvmb";
const CLOUDINARY_UPLOAD_PRESET = "happstat_explore";



// Open / close menu

function toggleUploadMenu() {

    uploadMenu.classList.toggle("show");

}


// Camera

function openCamera() {

    uploadMenu.classList.remove("show");

    cameraInput.click();

}


// Photos

function openPhotos() {

    uploadMenu.classList.remove("show");

    photosInput.click();

}


// Check video

function handleVideo(file, input) {

    if (!file) return;


    if (!file.type.startsWith("video/")) {

        alert("Please select a video.");

        input.value = "";

        return;

    }


    const video = document.createElement("video");

    video.preload = "metadata";


    video.onloadedmetadata = async function () {

        URL.revokeObjectURL(video.src);


        if (video.duration > 60) {

            alert("Video must be 1 minute or less.");

            input.value = "";

            return;

        }

       try {

            console.log("Original file:");
            console.log("Name:", file.name);
            console.log("Size:", file.size);
            console.log("Type:", file.type);

            await uploadToCloudinary(file);


        } catch (error) {

            console.error("UPLOAD ERROR:", error);

            alert("upload failed: " + "\n\n" + error.message);

        }
        

    };


    video.src = URL.createObjectURL(file);

}


// Send Cloudinary information to Flask

async function uploadToCloudinary(file) {

    console.log("Starting Cloudinary upload...");
    console.log("File:", file.name);
    console.log("Type:", file.type);
    console.log("Size:", file.size);

    const formData = new FormData();

    formData.append("file", file);
    formData.append(
        "upload_preset",
        "happstat_explore"
    );

    try {

        const response = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`,
            {
                method: "POST",
                body: formData
            }
        );

        const text = await response.text();

        console.log(
            "Cloudinary HTTP status:",
            response.status
        );

        console.log(
            "Cloudinary response:",
            text
        );

        if (!response.ok) {

            throw new Error(
                `Cloudinary error ${response.status}: ${text}`
            );

        }

        const result = JSON.parse(text);

        console.log(
            "Cloudinary upload successful:",
            result
        );

        await saveExplorePost(result);

    } catch (error) {

        console.error("CLOUDINARY ERROR:", error);

        alert("Cloudinary upload failed: " + "\n\n" + error.message);

    }

}

// ===============================
// SAVE POST TO FLASK
// ===============================

async function saveExplorePost(result) {

    try {

        const response = await fetch(
            "{{ url_for('explore_upload') }}",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    video_url: result.secure_url,

                    cloudinary_public_id:
                        result.public_id

                })

            }
        );


        const text = await response.text();


        console.log(
            "Flask HTTP status:",
            response.status
        );

        console.log(
            "Flask response:",
            text
        );


        if (!response.ok) {

            throw new Error(
                `Flask error ${response.status}: ${text}`
            );

        }


        console.log("Video saved successfully.");


        window.location.href =
            "{{ url_for('explore') }}";

    } catch (error) {

        console.error("FLASK ERROR:", error);

        alert("Save to Flask failed: " + "\n\n" + error.message);

    }

}


// ===============================
// CAMERA
// ===============================

cameraInput.addEventListener(
    "change",
    function () {

        handleVideo(
            this.files[0],
            this
        );

    }
);


// ===============================
// PHOTOS
// ===============================

photosInput.addEventListener(
    "change",
    function () {

        handleVideo(
            this.files[0],
            this
        );

    }
);


// ===============================
// CLOSE MENU
// ===============================

document.addEventListener(
    "click",
    function (event) {

        const button =
            document.querySelector(".add-btn");


        if (
            uploadMenu.classList.contains("show") &&
            !uploadMenu.contains(event.target) &&
            !button.contains(event.target)
        ) {

            uploadMenu.classList.remove("show");

        }

    }
);

</script>
