<!DOCTYPE html>
<html lang="en">

<head>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-KQWKWFQQ');</script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Choose Emoji - Happstat</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/update emoji.css') }}"
    >

</head>

 <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='favicon.png') }}">

<!-- Upload Progress -->
<div id="uploadProgress" class="upload-progress">
    <div class="upload-progress-ring">
        <svg viewBox="0 0 100 100">
            <circle
                class="progress-bg"
                cx="50"
                cy="50"
                r="42"
            ></circle>

            <circle
                id="progressCircle"
                class="progress-circle"
                cx="50"
                cy="50"
                r="42"
            ></circle>
        </svg>

        <div id="progressCheck" class="progress-check">✓</div>
    </div>

    <div id="uploadStatus" class="upload-status">
        Uploading…
    </div>
</div>

<body>
 
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KQWKWFQQ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

    <!-- Header -->

    <header class="header">

        <a
            href="{{ url_for('updates') }}"
            class="back-btn"
        >
            ‹
        </a>

        <div class="title">
            Happstat
        </div>

    </header>


    <!-- Emoji Selection -->

    <main class="content">

        <div class="heading">
            Choose an emoji
        </div>


        <div class="emoji-grid">

            {% for item in emojis %}

                <button
                    type="button"
                    class="emoji-btn"
                    data-id="{{ item.id }}"
                    data-emoji="{{ item.emoji }}"
                    aria-label="{{ item.name }}"
                >
                    {{ item.emoji }}
                </button>

            {% endfor %}

        </div>

    </main>


    <!-- Continue -->

    <div class="continue-container">

        <button
            type="button"
            id="continueBtn"
            class="continue-btn"
            disabled
        >
            Continue
        </button>

    </div>


    <!-- Status media menu -->
<div id="mediaMenu" class="media-menu">
    <div class="media-menu-overlay" id="mediaMenuOverlay"></div>

    <div class="media-menu-card">
        <div class="media-menu-title">Update status</div>

        <button type="button" id="cameraBtn" class="media-option">
            📷 <span>Camera</span>
        </button>

        <button type="button" id="photosBtn" class="media-option">
            🖼️ <span>Photos</span>
        </button>

        <button type="button" id="cancelBtn" class="media-cancel">
            Cancel
        </button>
    </div>
</div>

<!-- Hidden media inputs -->
<input
    type="file"
    id="cameraInput"
    accept="image/*"
    capture="environment"
    hidden
>

<input
    type="file"
    id="photosInput"
    accept="image/*,video/*"
    hidden
>


    <script
    <script src="{{ url_for('static', filename='js/update emoji.js') }}"></script>
    

</body>

</html>
